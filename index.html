<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Product client</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  button { font: inherit; padding: .4rem .9rem; margin-right: .5rem; }
  pre { background: #f4f4f5; padding: .75rem; border-radius: 6px; overflow-x: auto; }
  .err { color: #b91c1c; }
</style>

<h1>Product client</h1>
<p>
  <button id="health">GET /health</button>
  <button id="product">GET /products/1</button>
</p>
<pre id="out">Pick a request.</pre>

<script type="module">
  // same origin as the provider, so the base URL is empty
  import { getHealth, getProduct } from '/client.js';

  const out = document.getElementById('out');

  const show = (fn) => async () => {
    out.className = '';
    out.textContent = 'Loading…';
    try {
      out.textContent = JSON.stringify(await fn(), null, 2);
    } catch (err) {
      out.className = 'err';
      out.textContent = err.message;
    }
  };

  document.getElementById('health').onclick = show(() => getHealth(''));
  document.getElementById('product').onclick = show(() => getProduct('', '1'));
</script>
